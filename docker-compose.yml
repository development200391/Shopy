services:
  postgres:
    image: postgres:16-alpine
    container_name: shopy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopy
      POSTGRES_PASSWORD: shopy_dev_password
      POSTGRES_DB: shopy_dev
    ports:
      - "5432:5432"
    volumes:
      - shopy-postgres-data:/var/lib/postgresql/data

volumes:
  shopy-postgres-data:
