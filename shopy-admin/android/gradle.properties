org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compiler's "relocatable" cache crashes (IllegalArgumentException:
# "this and base files have different roots") when the pub cache (C:) and the project
# (D:) are on different Windows drive letters. Incremental caching is just a speed
# optimization, so disabling it trades a bit of rebuild time for a build that works.
kotlin.incremental=false
