org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Wajib di mesin ini: pub cache ada di drive C: sementara project di drive D:.
# Cache incremental Kotlin ("relocatable") tidak bisa menghitung path relatif
# antar drive di Windows, sehingga build gagal dengan "Could not close
# incremental caches ... Storage for [...] is already registered" atau
# "IllegalArgumentException: this and base files have different roots".
# Sudah dipasang juga di shopy-seller & shopy-admin karena masalahnya sama.
kotlin.incremental=false
